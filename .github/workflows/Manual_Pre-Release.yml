name: Manual_Pre-Release

on:
  workflow_dispatch:
    inputs:
      Version:
        description: "Version"
        required: true

permissions:
  contents: write

jobs:
  windows-latest:
    name: windows-latest
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          lfs: true
      - name: 'Cache: ~/.nuget/packages'
        uses: actions/cache@v6
        with:
          path: |
            ~/.nuget/packages
          key: ${{ runner.os }}-${{ hashFiles('**/global.json', '**/*.csproj', '**/Directory.Packages.props', '**/packages.lock.json') }}
      - name: 'Setup: .NET SDK'
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: 'Restore: dotnet tools'
        run: dotnet tool restore
      - name: 'Run: TaggedPreRelease'
        run: dotnet fallout TaggedPreRelease
        env:
          Version: ${{ github.event.inputs.Version }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: 'Publish: bin'
        uses: actions/upload-artifact@v7
        with:
          name: bin
          path: bin
      - name: 'Publish: velopack'
        uses: actions/upload-artifact@v7
        with:
          name: velopack
          path: velopack
